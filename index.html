<script>
'use strict';

/* ============================================================
   APAVAN VIGA PROTENDIDA — v2.1
   Novidades v2.1:
     • Seletor de bitolas comerciais (NBR 7480) para armadura
       passiva (inf/sup), estribos, fretagem e spalling
     • Cálculo usa área nominal da tabela
   ============================================================ */

/* ---------- TABELA DE BITOLAS COMERCIAIS (NBR 7480) ---------- */
const BITOLAS_COMERCIAIS = [
  {phi:3.2,  areaCm2:0.080, massa:0.063, perim:1.00, tipo:'fio'},
  {phi:4.0,  areaCm2:0.125, massa:0.100, perim:1.25, tipo:'fio'},
  {phi:5.0,  areaCm2:0.200, massa:0.160, perim:1.60, tipo:'ambos'},
  {phi:6.3,  areaCm2:0.315, massa:0.250, perim:2.00, tipo:'ambos'},
  {phi:8.0,  areaCm2:0.500, massa:0.400, perim:2.50, tipo:'ambos'},
  {phi:10.0, areaCm2:0.800, massa:0.630, perim:3.15, tipo:'ambos'},
  {phi:12.5, areaCm2:1.250, massa:1.000, perim:4.00, tipo:'ambos'},
  {phi:16.0, areaCm2:2.000, massa:1.600, perim:5.00, tipo:'barra'},
  {phi:20.0, areaCm2:3.150, massa:2.500, perim:6.30, tipo:'barra'},
  {phi:25.0, areaCm2:5.000, massa:4.000, perim:8.00, tipo:'barra'},
  {phi:32.0, areaCm2:8.000, massa:6.300, perim:10.00, tipo:'barra'}
];
function bitolaPorDiametro(phi){
  const alvo = Math.round(phi*10)/10;
  return BITOLAS_COMERCIAIS.find(b => Math.abs(b.phi - alvo) < 0.01) || null;
}
function areaDaBitola(phi){
  const b = bitolaPorDiametro(phi);
  return b ? b.areaCm2 : (Math.PI*phi*phi/4)/100;
}

/* ---------- CATÁLOGO RUDLOFF ---------- */
const RUDLOFF_PLACAS = {
  'AF 5-1': { cordoalha:'12.7', A:70,  B:130, C:90,  peso:1.30, cordoalhas:1 },
  'AF 5-2': { cordoalha:'12.7', A:110, B:150, C:100, peso:1.50, cordoalhas:2 },
  'AF 5-3': { cordoalha:'12.7', A:110, B:170, C:110, peso:1.80, cordoalhas:3 },
  'AF 5-4': { cordoalha:'12.7', A:130, B:180, C:130, peso:2.20, cordoalhas:4 },
  'AF 6-1': { cordoalha:'15.2', A:70,  B:130, C:90,  peso:1.30, cordoalhas:1 },
  'AF 6-2': { cordoalha:'15.2', A:110, B:150, C:100, peso:1.50, cordoalhas:2 },
  'AF 6-3': { cordoalha:'15.2', A:110, B:180, C:110, peso:1.90, cordoalhas:3 },
  'AF 6-4': { cordoalha:'15.2', A:130, B:190, C:130, peso:2.40, cordoalhas:4 }
};

/* ---------- LIMITES NBR 6118:2023 ---------- */
const SIGMA_LIM_PRE = { RN:{fptk:0.77,fpyk:0.90}, RB:{fptk:0.77,fpyk:0.90} };
const SIGMA_LIM_POS = { RN:{fptk:0.74,fpyk:0.87}, RB:{fptk:0.74,fpyk:0.82} };
const SIGMA_LIM_APOS= { RN:{fptk:0.70,fpyk:0.85}, RB:{fptk:0.70,fpyk:0.80} };

/* ---------- ESTADO PADRÃO ---------- */
const ESTADO_PADRAO = {
  projeto:{nome:'',cliente:'',obra:'',local:'',resp:'',data:'',art:'',rev:'R00',obs:''},
  geometria:{tipo:'retangular',L:10,Ltotal:10.4,h:0.80,bw:0.30,cobrimento:0.03,bfTop:0.80,hfTop:0.15,bfBot:0.40,hfBot:0.15},
  passiva:{fInf:12.5,nInf:4,dInf:0.06,fSup:10,nSup:2,dSup:0.05,cat:'CA-50',fyk:500,Es:210000},
  materiais:{fck:40,gamaC:1.4,gamaS:1.15,gamaP:1.1,alphaE:1.2,gamaConc:25,sIdade:0.25,idade:7,umidade:70,phi:2.0,epsCs:-0.30},
  protensao:{sistema:'pos',aderencia:'aderente',tipoAco:'cordoalha',relaxacao:'RB',fpk:1900,fpyk:1700,Ep:202000,diametro:12.7,Ap:100.9,nCordoalhas:12,nCabos:1,tensaoPct:0.74,mu:0.20,k:0.0007,slip:6,duasPontas:0},
  trajetoria:{tipo:'parabolica',eApoio:0.05,eMeio:0.35},
  acoes:{g2:5,q:10,P1:0,a1:5,P2:0,a2:5,P3:0,a3:5,psi0:0.6,psi1:0.4,psi2:0.3,gamaG:1.4,gamaQ:1.4},
  estribo:{phi:8,ramos:2,s:15,alfa:90},
  anc:{a:250,b:250,y:120,nCabos:1,tipo:'simples',espac:400,nCamadas:1,espacVertical:200,
       phiFret:12.5,nBarrasFret:6,sFret:80,nEstribosFret:4,phiSpall:8.0,nBarrasSpall:8,
       gammaP_anc:0.9,alphaBurst:0.25,alphaSpall:0.04,
       C:90, tipoRudloff:'AF 5-1', usarCatalogo:1},
  estrategia:{balancearPP:1},
  discretizacao:100
};
let S = deepClone(ESTADO_PADRAO);
let R = null;
let graficos = {};

/* ---------- UTILITÁRIOS ---------- */
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function el(id){ return document.getElementById(id); }
function qs(s,p){ return (p||document).querySelector(s); }
function qsa(s,p){ return Array.from((p||document).querySelectorAll(s)); }
function fmt(v,d){ d=(d===undefined)?2:d; if(v===null||v===undefined||!isFinite(v)) return '—'; return Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtG(v,d){ d=(d===undefined)?3:d; if(!isFinite(v)) return '—'; const a=Math.abs(v); if(a!==0&&(a<1e-3||a>=1e5)) return v.toExponential(3).replace('.',','); return fmt(v,d); }
function getPath(o,p){ return p.split('.').reduce((x,k)=>(x==null?undefined:x[k]),o); }
function setPath(o,p,v){ const ks=p.split('.'); let x=o; for(let i=0;i<ks.length-1;i++){ if(x[ks[i]]==null) x[ks[i]]={}; x=x[ks[i]]; } x[ks[ks.length-1]]=v; }
function badge(s){ const m={'OK':['ok','OK'],'ATENCAO':['warn','ATENÇÃO'],'NAO':['bad','NÃO VERIFICADO'],'NAO_IMP':['na','NÃO IMPLEMENTADO']}[s]||['na',s]; return '<span class="bg '+m[0]+'">'+m[1]+'</span>'; }
function alerta(t,tit,txt){ const ic={w:'⚠',e:'⛔',i:'ℹ',s:'✔'}[t]||'•'; return '<div class="alert '+t+'"><span class="ic">'+ic+'</span><div><b>'+tit+'</b><br>'+txt+'</div></div>'; }
function box(k,v,un,c){ return '<div class="it '+(c||'')+'"><div class="k">'+k+'</div><div class="v">'+v+(un?'<small>'+un+'</small>':'')+'</div></div>'; }
function safe(v){ return isFinite(v) ? v : 0; }

/* ---------- SELEÇÃO DE BITOLAS ---------- */
function popularSelectBitolas(selId){
  const sel = document.getElementById(selId);
  if(!sel) return;
  const valorAtual = parseFloat(sel.value) || null;
  sel.innerHTML = '';
  BITOLAS_COMERCIAIS.forEach(b=>{
    const opt = document.createElement('option');
    opt.value = b.phi;
    const tipo = b.tipo==='fio' ? ' (fio)' : (b.tipo==='barra' ? ' (barra)' : '');
    opt.textContent = fmt(b.phi,1) + ' mm' + tipo + ' — ' + fmt(b.areaCm2,3) + ' cm²';
    if(valorAtual!==null && Math.abs(b.phi - valorAtual) < 0.01) opt.selected = true;
    sel.appendChild(opt);
  });
  if(sel.value === '' && sel.options.length) sel.selectedIndex = 0;
}
function atualizarHintsBitolas(){
  const fInf = parseFloat(S.passiva.fInf) || 0;
  const nInf = parseInt(S.passiva.nInf) || 0;
  const fSup = parseFloat(S.passiva.fSup) || 0;
  const nSup = parseInt(S.passiva.nSup) || 0;
  const aInf = areaDaBitola(fInf);
  const aSup = areaDaBitola(fSup);
  const totalInf = aInf * nInf;
  const totalSup = aSup * nSup;
  const hintInf = el('hintFInf');
  if(hintInf) hintInf.textContent = fmt(aInf,3)+' cm²/un';
  const hintSup = el('hintFSup');
  if(hintSup) hintSup.textContent = fmt(aSup,3)+' cm²/un';
  const txtInf = el('areaInfTxt');
  if(txtInf) txtInf.innerHTML = '<b>'+fmt(totalInf,2)+' cm²</b> ('+nInf+' × Ø'+fmt(fInf,1)+' mm)';
  const txtSup = el('areaSupTxt');
  if(txtSup) txtSup.innerHTML = '<b>'+fmt(totalSup,2)+' cm²</b> ('+nSup+' × Ø'+fmt(fSup,1)+' mm)';
  S.passiva._AsInfCm2 = totalInf;
  S.passiva._AsSupCm2 = totalSup;
}
function inicializarSelectsBitolas(){
  popularSelectBitolas('selFInf');
  popularSelectBitolas('selFSup');
  popularSelectBitolas('selEstribo');
  popularSelectBitolas('selPhiFret');
  popularSelectBitolas('selPhiSpall');
  const set = (id, val) => { const s = el(id); if(s) s.value = String(val); };

/* ---------- GEOMETRIA ---------- */
function retangulosSecao(g){
  const r=[],h=g.h,bw=g.bw;
  if(g.tipo==='retangular') r.push({b:bw,h:h,y0:0});
  else if(g.tipo==='T'){ const hw=h-g.hfTop; r.push({b:bw,h:hw,y0:0}); r.push({b:g.bfTop,h:g.hfTop,y0:hw}); }
  else { const hw=h-g.hfTop-g.hfBot; r.push({b:g.bfBot,h:g.hfBot,y0:0}); r.push({b:bw,h:hw,y0:g.hfBot}); r.push({b:g.bfTop,h:g.hfTop,y0:g.hfBot+hw}); }
  return r;
}
function calcularSecao(g){
  const rets=retangulosSecao(g);
  let A=0,Mx=0;
  rets.forEach(r=>{ const a=r.b*r.h; A+=a; Mx+=a*(r.y0+r.h/2); });
  const ycg=Mx/A;
  let Ix=0,Iy=0;
  rets.forEach(r=>{ const a=r.b*r.h,yc=r.y0+r.h/2,dy=yc-ycg; Ix+=r.b*Math.pow(r.h,3)/12+a*dy*dy; Iy+=r.h*Math.pow(r.b,3)/12; });
  const h=g.h,ysup=h-ycg,yinf=ycg;
  return {retangulos:rets,A:A,ycg:ycg,Ix:Ix,Iy:Iy,ysup:ysup,yinf:yinf,h:h,
    Wsup:Ix/ysup,Winf:Ix/yinf,i_x:Math.sqrt(Ix/A),i_y:Math.sqrt(Iy/A),
    bMax:Math.max.apply(null,rets.map(r=>r.b)),
    larguraEm:function(y){ let b=0; rets.forEach(r=>{ if(y>=r.y0-1e-9&&y<=r.y0+r.h+1e-9) b+=r.b; }); return b; }};
}

/* ---------- MATERIAIS ---------- */
function calcularMateriais(m,idade){
  const fck=m.fck,gc=m.gamaC,fcd=fck/gc;
  const fctm = fck<=50 ? 0.3*Math.pow(fck,2/3) : 2.12*Math.log(1+0.11*fck);
  const fctkInf=0.7*fctm, fctkSup=1.3*fctm, fctd=fctkInf/gc;
  const Eci=m.alphaE*5600*Math.sqrt(fck);
  const alphaI=Math.min(1.0,0.8+0.2*fck/80);
  const Ecs=alphaI*Eci;
  const t=Math.max(1,idade);
  const beta=Math.exp(m.sIdade*(1-Math.sqrt(28/t)));
  const fckj=fck*Math.min(1,beta);
  const Ecij=m.alphaE*5600*Math.sqrt(Math.max(fckj,1));
  const nu=0.2,G=Ecs/(2*(1+nu));
  return {fck:fck,fcd:fcd,fctm:fctm,fctkInf:fctkInf,fctkSup:fctkSup,fctd:fctd,Eci:Eci,Ecs:Ecs,alphaI:alphaI,fckj:fckj,Ecij:Ecij,nu:nu,G:G,betaIdade:beta};
}

/* ---------- AÇÕES ---------- */
function excentricidade(x,L,tr){
  if(tr.tipo==='reto') return tr.eMeio;
  if(tr.tipo==='poligonal'){ const xm=L/2; return x<=xm ? tr.eApoio+(tr.eMeio-tr.eApoio)*(x/xm) : tr.eMeio+(tr.eApoio-tr.eMeio)*((x-xm)/xm); }
  const xi=x/L; return tr.eApoio+(tr.eMeio-tr.eApoio)*4*xi*(1-xi);
}
function thetaCabo(x,L,tr){
  const d=tr.eMeio-tr.eApoio;
  if(tr.tipo==='reto') return 0;
  if(tr.tipo==='poligonal') return 2*Math.abs(d)*Math.min(x,L-x)/L;
  const xe=Math.min(x,L-x); return 8*Math.abs(d)*xe/(L*L);
}
function cargasPontuais(a){
  const list=[]; [[a.P1,a.a1],[a.P2,a.a2],[a.P3,a.a3]].forEach(p=>{ if(p[0]&&p[0]!==0) list.push({P:p[0],a:p[1]}); }); return list;
}
function esforcosGrav(x,L,q,pont){
  let M=q*x*(L-x)/2,V=q*(L/2-x);
  pont.forEach(p=>{ const a=p.a,b=L-a,P=p.P;
    if(a<=0||a>=L) return;
    if(x<=a){ M+=P*b*x/L; V+=P*b/L; } else { M+=P*a*(L-x)/L; V-=P*a/L; } });
  return {M:M,V:V};
}
function cortanteProtensao(x,L,tr,P){
  const dx=1e-4;
  const e1=excentricidade(Math.max(0,x-dx),L,tr);
  const e2=excentricidade(Math.min(L,x+dx),L,tr);
  return -P*(e2-e1)/(Math.min(L,x+dx)-Math.max(0,x-dx));
}

/* ---------- PROTENSÃO ---------- */
function calcularProtensaoInicial(S){
  const p=S.protensao;
  const nTotal=p.nCabos*p.nCordoalhas;
  const ApTotal=nTotal*p.Ap;
  const sigmaP0=p.tensaoPct*p.fpk;
  const P0=sigmaP0*ApTotal/1000;
  return {nTotal:nTotal,ApTotal:ApTotal*1e-6,ApTotalMm2:ApTotal,sigmaP0:sigmaP0,P0:P0};
}
function perdaAtrito(x,L,tr,P0,mu,k){
  const th=thetaCabo(x,L,tr);
  const Px=P0*Math.exp(-(mu*th+k*x));
  return {P:Px,theta:th,perda:P0-Px};
}
function perdaAcomodacao(P0,L,tr,mu,k,slipMm,Ep,ApM2){
  const p0=perdaAtrito(0.001,L,tr,P0,mu,k);
  const p1=perdaAtrito(0.05,L,tr,P0,mu,k);
  const slope=(p0.perda-p1.perda)/(0.05-0.001);
  if(!isFinite(slope)||slope<=1e-9) return {dP:0,xa:0,slope:0};
  const EpAp=Ep*1e3*ApM2;
  const slip=slipMm/1000;
  const dP=Math.sqrt(Math.max(0, 2*slope*EpAp*slip));
  const xa=isFinite(dP/slope)?(dP/slope):0;
  return {dP:isFinite(dP)?Math.min(dP,P0*0.5):0, xa:xa, slope:slope};
}
function perdaRelaxacao(psi1000,sigmaPi,fpk,tHoras){
  const r=sigmaPi/fpk;
  let fator; if(r>=0.6) fator=1; else if(r>0.5) fator=(r-0.5)/0.1; else fator=0;
  const rho=(psi1000/100)*Math.pow(tHoras/1000,0.15)*fator;
  return {rho:rho,dSigma:rho*sigmaPi};
}
function calcularPerdas(S,mat,sec,pIni,tr,L){
  const p=S.protensao,xm=L/2,ApM2=pIni.ApTotal;
  const aMeio=perdaAtrito(xm,L,tr,pIni.P0,p.mu,p.k);
  const aFim=perdaAtrito(L*0.999,L,tr,pIni.P0,p.mu,p.k);
  const ac=perdaAcomodacao(pIni.P0,L,tr,p.mu,p.k,p.slip,p.Ep,ApM2);
  const Ac=sec.A,Ic=sec.Ix;
  const eCabo=excentricidade(xm,L,tr);
  const dCabo=eCabo;
  const Pmeio=aMeio.P-ac.dP*0.5;
  const qg1=Ac*S.materiais.gamaConc/1000;
  const sCpP=-Pmeio/(1000*Ac)-Pmeio*eCabo*dCabo/(1000*Ic);
  const Mg1=qg1*xm*(L-xm)/2;
  const sCpG=Mg1*dCabo/(1000*Ic);
  const sCp=sCpP-sCpG;
  const alphaP=p.Ep/mat.Ecs;
  const fatorSequencial=(p.sistema==='pos')?0.5:1.0;
  const dSigmaEl=alphaP*Math.abs(sCp)*fatorSequencial;
  const dPEl=dSigmaEl*pIni.ApTotalMm2/1000;
  const perdaImedTotal=(pIni.P0-aMeio.P)+ac.dP+dPEl;
  const Pi=pIni.P0-perdaImedTotal;
  const sigmaPi=Pi*1000/pIni.ApTotalMm2;
  const psi1000=(p.relaxacao==='RB')?2.5:4.5;
  const relax=perdaRelaxacao(psi1000,sigmaPi,p.fpk,200000);
  const epsCs=S.materiais.epsCs/1000;
  const phi=S.materiais.phi;
  const sigmaCgP=sCpP-sCpG;
  const num=epsCs*p.Ep+alphaP*Math.abs(sigmaCgP)*phi+relax.dSigma;
  const den=1+alphaP*(pIni.ApTotal/Ac)*(1+(Ac/Ic)*eCabo*eCabo)*(1+phi);
  const dSigmaProg=isFinite(num/den)?(num/den):0;
  const dPProg=dSigmaProg*pIni.ApTotalMm2/1000;
  const Pinf=Pi-dPProg;
  return {aMeio:aMeio,aFim:aFim,ac:ac,dPEl:dPEl,dSigmaEl:dSigmaEl,sCp:sCp,alphaP:alphaP,
    P0:pIni.P0,Pi:Pi,Pinf:Pinf,perdaImed:perdaImedTotal,perdaProg:dPProg,
    perdaTotal:pIni.P0-Pinf,perdaImedPct:100*perdaImedTotal/pIni.P0,
    perdaProgPct:100*dPProg/pIni.P0,perdaTotalPct:100*(pIni.P0-Pinf)/pIni.P0,
    sigmaPi:sigmaPi,relax:relax,dSigmaProg:dSigmaProg,epsCs:epsCs,phi:phi,eCabo:eCabo,
    sCpP:sCpP,sCpG:sCpG,sigmaCgP:sigmaCgP};
}

/* ---------- TENSÕES ---------- */
function tensao(y,P,Mtot,Ac,Ic){ return (-P/(1000*Ac)+Mtot*y/(1000*Ic)); }
function tensoesSecao(x,L,tr,P,Ac,Ic,ysup,yinf,Mext){
  const e=excentricidade(x,L,tr),Mp=-P*e,M=Mext+Mp;
  return {Mp:Mp,Mtot:M,sSup:tensao(-ysup,P,M,Ac,Ic),sInf:tensao(yinf,P,M,Ac,Ic),sCabo:tensao((yinf-e),P,M,Ac,Ic),e:e};
}

function verificarTensoesAtivas(S, mat, sec, pIni, perdas, Pef){

  const fpk=p.fpk, fpyk=p.fpyk;

  const lim=(p.sistema==='pos')?SIGMA_LIM_POS[classe]:SIGMA_LIM_PRE[classe];
  const sigmaPi=pIni.sigmaP0;
  const sigmaP0=perdas.Pi*1000/Ap;
  const sigmaPinf=perdas.Pinf*1000/Ap;

function verificarAtoProtensao(S, mat, sec, pIni, perdas, tr){

/* ---------- ELU FLEXÃO ---------- */
function sigmaAcoProtensao(eps,fpyk,fpk,Ep,gammaP){
  const fpyd=fpyk/gammaP,fpkd=fpk/gammaP,epsY=fpyd/Ep,epsU=0.035;
  if(eps<=epsY) return Ep*eps;
  if(eps>=epsU) return fpkd;
  return fpyd+(fpkd-fpyd)*(eps-epsY)/(epsU-epsY);
}
function sigmaAcoPassivo(eps,fyd,Es){
  const e=Math.abs(eps),ey=fyd/Es;
  return (e<=ey)?Es*eps:Math.sign(eps)*fyd;
}
function blocoTensoes(fck){
  let lambda,alphaC;
  if(fck<=50){ lambda=0.8; alphaC=0.85; }
  else{ lambda=0.8-(fck-50)/400; alphaC=0.85*(1-(fck-50)/200); }
  return {lambda:lambda,alphaC:alphaC};
}
function forcaCompressao(sec,xTopo,lambda,alphaC,fcd,hTotal){
  const yBloco=lambda*xTopo,n=200,dy=yBloco/n;
  let C=0,Mc=0;
  for(let i=0;i<n;i++){
    const yTop=(i+0.5)*dy,yFibraInf=hTotal-yTop;
    const b=sec.larguraEm(yFibraInf);
    const dC=alphaC*fcd*1000*b*dy;
    C+=dC; Mc+=dC*yTop;
  }
  return {C:C,yC:Mc/Math.max(C,1e-12),depth:yBloco};
}
function calcularFlexao(S,mat,sec,AsInf,dInf,AsSup,dSup,ApM2,dpCabo,sigmaPefMPA,Msd){
  const h=sec.h;
  const d=h-dInf,d2=dSup,dp=h-dpCabo;
  const {lambda,alphaC}=blocoTensoes(mat.fck);
  const fcd=mat.fcd,fyd=S.passiva.fyk/S.materiais.gamaS,Es=S.passiva.Es;
  const gammaP=S.materiais.gamaP;
  const epsP0=sigmaPefMPA/S.protensao.Ep;
  const x23=d*3.5/(3.5+10);
  function estado(x){
    x=Math.max(x,1e-4);
    let epsC_permil;
    if(x<=x23){ epsC_permil=10*x/(d-x); if(!isFinite(epsC_permil)) epsC_permil=3.5; } else { epsC_permil=3.5; }
    epsC_permil=Math.min(epsC_permil,3.5);
    const epsC=epsC_permil/1000;
    const epsS=epsC*(d-x)/x;
    const epsS2=epsC*(x-d2)/x;
    const epsP=epsP0+epsC*(dp-x)/x;
    return {x:x,epsC:epsC,epsS:epsS,epsS2:epsS2,epsP:epsP};
  }
  function esforcos(x){
    const e=estado(x);
    const bl=forcaCompressao(sec,x,lambda,alphaC,fcd,h);
    let C=bl.C;
    const ss2=sigmaAcoPassivo(e.epsS2,fyd,Es);
    if(e.epsS2>0) C+=AsSup*ss2*1000;
    const ss=sigmaAcoPassivo(e.epsS,fyd,Es);
    const sp=sigmaAcoProtensao(Math.max(e.epsP,0),S.protensao.fpyk,S.protensao.fpk,S.protensao.Ep,gammaP);
    const T=AsInf*ss*1000+ApM2*sp*1000;
    const yT=(AsInf*Math.abs(ss)*d+ApM2*sp*dp)/Math.max(AsInf*Math.abs(ss)+ApM2*sp,1e-12);
    return {C:C,T:T,bl:bl,ss:ss,sp:sp,ss2:ss2,eps:e,yT:yT};
  }
  let lo=1e-3*h,hi=0.98*h,x=0.3*d,res=null;
  for(let i=0;i<120;i++){ x=0.5*(lo+hi); res=esforcos(x); if(res.C-res.T<0) lo=x; else hi=x; }
  res=esforcos(x);
  const z=res.yT-res.bl.yC;
  const Mrd=Math.min(res.C,res.T)*z;
  let dominio='—';
  const x34=d*3.5/(3.5+(fyd/Es)*1000);
  if(x<=0) dominio='1'; else if(x<=x23) dominio='2'; else if(x<=x34) dominio='3'; else dominio='4';
  return {x:x,d:d,d2:d2,dp:dp,x23:x23,x34:x34,dominio:dominio,
    epsC:res.eps.epsC,epsS:res.eps.epsS,epsS2:res.eps.epsS2,epsP:res.eps.epsP,
    C:res.C,T:res.T,bloco:res.bl,ss:res.ss,sp:res.sp,ss2:res.ss2,
    yT:res.yT,yC:res.bl.yC,z:z,Mrd:Mrd,Msd:Msd,utilizacao:Msd/Math.max(Mrd,1e-9),
    lambda:lambda,alphaC:alphaC,fyd:fyd,gammaP:gammaP,AsInf:AsInf,AsSup:AsSup,ApM2:ApM2};
}

/* ---------- CISALHAMENTO ---------- */
function calcularCisalhamento(S,mat,sec,Vsd,AsInf,d,Asw_s,alfaGraus,Pinf){
  const bw=S.geometria.bw,fcd=mat.fcd,fctd=mat.fctd,fctm=mat.fctm;
  const fywk=S.passiva.fyk,fywd=fywk/S.materiais.gamaS;
  const alfa=alfaGraus*Math.PI/180;
  const alphaV2=1-mat.fck/250;
  const VRd2=0.5*alphaV2*fcd*1000*bw*0.9*d;
  const tauRd=0.25*fctd;
  const k=Math.max(1,1.6-d);
  const rho1=Math.min(0.02,AsInf/(bw*d));
  const sigmaCp=Pinf/(1000*sec.A);
  const VRd1=(tauRd*1000*k*(1.2+40*rho1)+0.15*sigmaCp*1000)*bw*d;
  const Vc=VRd1;
  const Vsw=Asw_s*0.9*d*fywd*1000*(Math.sin(alfa)+Math.cos(alfa));
  const VRd3=Vc+Vsw;
  const denAsw=0.9*d*fywd*1000*(Math.sin(alfa)+Math.cos(alfa));
  const AswS_nec=denAsw>0?Math.max(0,(Vsd-Vc)/denAsw):0;
  const rhoSwMin=0.2*fctm/fywk;
  const AswS_min=rhoSwMin*bw*Math.sin(alfa);
  return {Vsd:Vsd,VRd1:VRd1,VRd2:VRd2,VRd3:VRd3,Vc:Vc,Vsw:Vsw,tauRd:tauRd,k:k,rho1:rho1,sigmaCp:sigmaCp,
    alphaV2:alphaV2,AswS_nec:AswS_nec,AswS_min:AswS_min,AswS_exist:Asw_s,fywd:fywd,
    utilCorte:Vsd/Math.max(VRd2,1e-9),utilFlex:Vsd/Math.max(VRd3,1e-9)};
}

/* ---------- FLECHA ---------- */
function resolverFlecha(L,n,Mfunc,EIfunc){
  const dx=L/n,x=[],kappa=[],Mv=[];
  for(let i=0;i<=n;i++){
    const xi=i*dx; x.push(xi);
    const Mi=Mfunc(xi),EI=EIfunc(xi);
    Mv.push(Mi); kappa.push(Mi/Math.max(EI,1e-9));
  }
  const theta=new Array(n+1).fill(0);
  for(let i=1;i<=n;i++) theta[i]=theta[i-1]+(kappa[i]+kappa[i-1])*dx/2;
  const delta=new Array(n+1).fill(0);
  for(let i=1;i<=n;i++) delta[i]=delta[i-1]+(theta[i]+theta[i-1])*dx/2;
  const c=-delta[n]/L;
  for(let i=0;i<=n;i++) delta[i]+=c*x[i];
  let dmax=0,xdmax=0;
  for(let i=0;i<=n;i++) if(Math.abs(delta[i])>Math.abs(dmax)){ dmax=delta[i]; xdmax=x[i]; }
  return {x:x,M:Mv,delta:delta,dmax:dmax,xdmax:xdmax,n:n,dx:dx};
}
function momentoFissuracao(mat,sec){ return 1.5*mat.fctm*1000*sec.Ix/sec.yinf; }

/* ---------- PLACA DE ANCORAGEM ---------- */
function calcularPlacaAncoragem(S,mat,sec,PkPorCabo){
  const a=S.anc.a, b=S.anc.b, yAnc=S.anc.y;
  const h=sec.h*1000, bw=sec.bw*1000;
  const nCabos=S.anc.nCabos, tipo=S.anc.tipo, espac=S.anc.espac;
  const Ptotal=PkPorCabo*nCabos;
  const Ac0_uma=a*b;
  let Ac0_total=Ac0_uma*nCabos;
  if(tipo==='multipla'&&nCabos>1) Ac0_total=nCabos*a*b;
  const A1_bw=bw*h;
  const A1_por_placa=A1_bw/nCabos;
  const ratio=Math.max(1.0,Math.min(9.0,A1_por_placa/Ac0_uma));
  const fatorConf=Math.sqrt(ratio);
  const sigmaLocal=Ptotal*1000/Ac0_total;
  const fcdLocal=mat.fcd*fatorConf;
  const utilLocal=sigmaLocal/fcdLocal;
  const aMenor=Math.min(a,b), aMaior=Math.max(a,b);
  const lIntro=Math.min(2*h,Math.max(h,2*aMaior));
  const alphaBurst=S.anc.alphaBurst;
  const yTopo=h-yAnc-b;
  const hEf_burst=Math.min(h,2*Math.min(yAnc,yTopo)+b);
  const Ts_burst=alphaBurst*Ptotal*Math.max(0.05,1-aMenor/hEf_burst);
  const alphaSpall=S.anc.alphaSpall;
  const Ts_spall=alphaSpall*Ptotal;
  const Ts_total=Ts_burst+Ts_spall;
  const fyd=S.passiva.fyk/S.materiais.gamaS;
  const As_burst=Ts_burst*1000/fyd;
  const As_spall=Ts_spall*1000/fyd;
  const As_total=As_burst+As_spall;
  const phiFret=S.anc.phiFret, nBarras=S.anc.nBarrasFret;
  const As_uma_barra=areaDaBitola(phiFret)*100;   /* cm² → mm² */
  const As_fret_exist=nBarras*As_uma_barra;
  const phiSpall=S.anc.phiSpall, nBarrasSpall=S.anc.nBarrasSpall;
  const As_uma_spall=areaDaBitola(phiSpall)*100;
  const As_spall_exist=nBarrasSpall*As_uma_spall;
  const sFret=S.anc.sFret, nEstribosFret=S.anc.nEstribosFret;
  const lFretDisp=nEstribosFret*sFret;
  const lFretNec=0.5*lIntro;
  return {a:a,b:b,yAnc:yAnc,yTopo:yTopo,h:h,bw:bw,nCabos:nCabos,tipo:tipo,espac:espac,
    Ptotal:Ptotal,Pcabo:PkPorCabo,Ac0_uma:Ac0_uma,Ac0_total:Ac0_total,A1_por_placa:A1_por_placa,
    ratio:ratio,fatorConf:fatorConf,sigmaLocal:sigmaLocal,fcdLocal:fcdLocal,utilLocal:utilLocal,
    aMenor:aMenor,aMaior:aMaior,lIntro:lIntro,hEf_burst:hEf_burst,
    alphaBurst:alphaBurst,alphaSpall:alphaSpall,Ts_burst:Ts_burst,Ts_spall:Ts_spall,Ts_total:Ts_total,
    As_burst:As_burst,As_spall:As_spall,As_total:As_total,phiFret:phiFret,nBarras:nBarras,As_fret_exist:As_fret_exist,
    phiSpall:phiSpall,nBarrasSpall:nBarrasSpall,As_spall_exist:As_spall_exist,
    utilBurst:As_burst/Math.max(As_fret_exist,1e-9),utilSpall:As_spall/Math.max(As_spall_exist,1e-9),
    utilTotal:As_total/Math.max(As_fret_exist+As_spall_exist,1e-9),
    sFret:sFret,nEstribosFret:nEstribosFret,lFretDisp:lFretDisp,lFretNec:lFretNec};
}
function calcularAncoragem(S,mat,sec,Pk){
  const a=S.anc.a/1000,b=S.anc.b/1000,Ac0=a*b,Ac1=sec.A,fcd=mat.fcd;
  const fcdLocal=fcd*Math.sqrt(Math.min(Ac1/Ac0,3.0));
  const sigmaLocal=Pk/(1000*Ac0);
  const utilLocal=sigmaLocal/fcdLocal;
  const h=sec.h,lIntro=Math.max(h,a,b);
  const Tsplit=0.25*Pk*Math.max(0,1-(Math.min(a,b)/h));
  const fyd=S.passiva.fyk/S.materiais.gamaS;
  const AsFret=Tsplit*1000/fyd;
  return {Ac0:Ac0,fcdLocal:fcdLocal,sigmaLocal:sigmaLocal,utilLocal:utilLocal,
    lIntro:lIntro,Tsplit:Tsplit,AsFret:AsFret/100,AsFretMm2:AsFret,a:a*1000,b:b*1000,Pk:Pk};
}

/* ---------- BALANCEAMENTO ---------- */
function calcularCargaBalanceamento(S,sec,tr,L,Pef,qExt,qg1){
  const eMeio=excentricidade(L/2,L,tr);
  const wp=8*eMeio*Pef/(L*L);
  const pct=qExt>0?(wp/qExt)*100:0;
  const pctPP=qg1>0?(wp/qg1)*100:0;
  const qResidual=qExt-wp;
  const resPP=qg1-wp;
  return {wp:wp,eMeio:eMeio,P:Pef,L:L,qExt:qExt,qg1:qg1,pct:pct,pctPP:pctPP,qResidual:qResidual,resPP:resPP};
}
function wpEmX(x,L,tr,P){
  if(tr.tipo==='reto') return 0;
  if(tr.tipo==='parabolica') return 8*(tr.eMeio-tr.eApoio)*P/(L*L);
  const dx=0.02;
  const e1=excentricidade(Math.max(0,x-dx),L,tr);
  const e0=excentricidade(x,L,tr);
  const e2=excentricidade(Math.min(L,x+dx),L,tr);
  const d2e=(e1-2*e0+e2)/(dx*dx);
  return -P*d2e;
}
function calcularEstrategia(S, qg1, qg2, qq, pont, L){
  const gamG=S.acoes.gamaG, gamQ=S.acoes.gamaQ;
  const g1_maj=gamG*qg1;
  const qResidual_maj=gamG*qg2+gamQ*qq;
  const n=50, dx=L/n;
  const pontos=[];
  for(let i=0;i<=n;i++){
    const x=i*dx;
    const Mg1_maj=gamG*esforcosGrav(x,L,qg1,[]).M;
    const Mg2_maj=gamG*esforcosGrav(x,L,qg2,[]).M;
    const Mq_maj=gamQ*esforcosGrav(x,L,qq,[]).M;
    const Mpont_maj=gamQ*esforcosGrav(x,L,0,pont).M;
    const Mresidual=Mg2_maj+Mq_maj+Mpont_maj;
    pontos.push({x:x,Mg1_maj:Mg1_maj,Mresidual:Mresidual,Mtot:Mg1_maj+Mresidual});
  }
  return {g1_maj:g1_maj,qResidual_maj:qResidual_maj,pontos:pontos,n:n};
}

/* ---------- ORQUESTRAÇÃO ---------- */
function calcularTudo(){
  const geo=S.geometria,matS=S.materiais,p=S.protensao,tr=S.trajetoria;
  const L=Math.max(0.1,geo.L);
  const sec=calcularSecao(geo);
  const mat=calcularMateriais(matS,matS.idade);

  /* Áreas da armadura passiva (usa tabela de bitolas quando disponível) */
  const aInfUnit = areaDaBitola(S.passiva.fInf)*1e-4;   /* m² por barra */
  const aSupUnit = areaDaBitola(S.passiva.fSup)*1e-4;
  const AsInf = (S.passiva.nInf||0) * aInfUnit;
  const AsSup = (S.passiva.nSup||0) * aSupUnit;

  const pIni=calcularProtensaoInicial(S);
  const perdas=calcularPerdas(S,mat,sec,pIni,tr,L);
  const Pef=perdas.Pinf, Pei=perdas.Pi;
  const qg1=sec.A*matS.gamaConc;
  const qg2=S.acoes.g2, qq=S.acoes.q;
  const pont=cargasPontuais(S.acoes);
  const qPerm=qg1+qg2, qTot=qPerm+qq;
  const n=parseInt(S.discretizacao,10)||100, dx=L/n;
  const pontos=[];
  for(let i=0;i<=n;i++){
    const x=i*dx;
    const Pat=perdaAtrito(x,L,tr,pIni.P0,p.mu,p.k);
    const Pact=safe(Math.max(0,Pat.P-(perdas.ac.dP*0.5)-perdas.dPEl-perdas.dPProg));
    const eg1=esforcosGrav(x,L,qg1,[]);
    const eg2=esforcosGrav(x,L,qg2,[]);
    const eq=esforcosGrav(x,L,qq,[]);
    const ep=esforcosGrav(x,L,0,pont);
    const e=excentricidade(x,L,tr);
    const Mp=safe(-Pact*e);
    const Vp=safe(cortanteProtensao(x,L,tr,Pact));
    const Mqp=safe(eg1.M+eg2.M+S.acoes.psi2*(eq.M+ep.M)+Mp);
    const Mfr=safe(eg1.M+eg2.M+S.acoes.psi1*(eq.M+ep.M)+Mp);
    const Mra=safe(eg1.M+eg2.M+eq.M+ep.M+Mp);
    const Melu=safe(S.acoes.gamaG*(eg1.M+eg2.M+ep.M)+S.acoes.gamaQ*eq.M+Math.min(S.materiais.gamaP*Mp,0.9*Mp));
    const Vgrav=safe(S.acoes.gamaG*(eg1.V+eg2.V+ep.V)+S.acoes.gamaQ*eq.V);
    const Velu=safe(Vgrav+S.materiais.gamaP*Vp);
    const tens=tensoesSecao(x,L,tr,Pact,sec.A,sec.Ix,sec.ysup,sec.yinf,eg1.M+eg2.M+S.acoes.psi2*(eq.M+ep.M));
    const tensRara=tensoesSecao(x,L,tr,Pact,sec.A,sec.Ix,sec.ysup,sec.yinf,eg1.M+eg2.M+eq.M+ep.M);
    pontos.push({x:x,P:Pact,e:e,Mg1:eg1.M,Mg2:eg2.M,Mq:eq.M,Mpont:ep.M,
      Mqp:Mqp,Mfr:Mfr,Mra:Mra,Melu:Melu,Mp:Mp,
      Vg1:eg1.V,Vg2:eg2.V,Vq:eq.V,Vponto:ep.V,Vp:Vp,Velu:Velu,
      sSup:tens.sSup,sInf:tens.sInf,sSupRara:tensRara.sSup,sInfRara:tensRara.sInf,sCabo:tens.sCabo});
  }
  if(!pontos.length) throw new Error('Nenhum ponto calculado — verifique a discretização.');
  let idxMaxM=0; for(let i=1;i<pontos.length;i++){ if(pontos[i].Melu>pontos[idxMaxM].Melu) idxMaxM=i; }
  let idxMaxV=0; for(let i=1;i<pontos.length;i++){ if(Math.abs(pontos[i].Velu)>Math.abs(pontos[idxMaxV].Velu)) idxMaxV=i; }
  const secCrit=pontos[idxMaxM], secCritV=pontos[idxMaxV];
  const dpCabo=sec.yinf-excentricidade(secCrit.x,L,tr);
  const sigmaPef=safe(Pef*1000/pIni.ApTotalMm2);
  const flexao=calcularFlexao(S,mat,sec,AsInf,S.passiva.dInf,AsSup,S.passiva.dSup,pIni.ApTotal,dpCabo,sigmaPef,secCrit.Melu);
  const dUtil=sec.h-S.passiva.dInf;
  const xCis=Math.min(dUtil,L/2);
  let pCis=pontos[0], dMin=Math.abs(pontos[0].x-xCis);
  for(let i=1;i<pontos.length;i++){ const dd=Math.abs(pontos[i].x-xCis); if(dd<dMin){ dMin=dd; pCis=pontos[i]; } }
  const phiEst=S.estribo.phi/1000;
  const Asw=S.estribo.ramos*areaDaBitola(S.estribo.phi)*1e-4;
  const sEst=S.estribo.s/100;
  const Asw_s=sEst>0?Asw/sEst:0;
  const cis=calcularCisalhamento(S,mat,sec,safe(Math.abs(pCis.Velu)),AsInf,dUtil,Asw_s,S.estribo.alfa,Pef);
  const EI_gross=mat.Ecs*1000*sec.Ix;
  const EIf=function(){ return EI_gross; };
  const Mgrav=function(x){ return esforcosGrav(x,L,qPerm,[]).M+esforcosGrav(x,L,qq,[]).M+esforcosGrav(x,L,0,pont).M; };
  const Mperm=function(x){ return esforcosGrav(x,L,qPerm,[]).M; };
  const Mvar=function(x){ return esforcosGrav(x,L,qq,[]).M+esforcosGrav(x,L,0,pont).M; };
  const Mprot=function(x){ return -Pef*excentricidade(x,L,tr); };
  const fGrav=resolverFlecha(L,n,Mgrav,EIf);
  const fPerm=resolverFlecha(L,n,Mperm,EIf);
  const fVar=resolverFlecha(L,n,Mvar,EIf);
  const fProt=resolverFlecha(L,n,Mprot,EIf);
  const flechaTotal=fGrav.delta.map((v,i)=>v+fProt.delta[i]);
  let flMax=0,xFlMax=0;
  flechaTotal.forEach((v,i)=>{ if(Math.abs(v)>Math.abs(flMax)){ flMax=v; xFlMax=fGrav.x[i]; } });
  const rhoLinha=AsSup/Math.max(S.geometria.bw*dUtil,1e-9);
  const alphaF=S.materiais.phi/(1+50*rhoLinha);
  const flDif=flMax*alphaF;
  const flTotalDiferida=flMax*(1+alphaF);
  const limTotal=L/250,limVar=L/350;
  const ancSimples=calcularAncoragem(S,mat,sec,Math.max(Pef,pIni.P0*0.8));
  const Mr=momentoFissuracao(mat,sec);
  let MaMax=0;
  for(let i=0;i<pontos.length;i++){ if(Math.abs(pontos[i].Mra)>MaMax) MaMax=Math.abs(pontos[i].Mra); }
  const Pk_cabo=(pIni.P0/Math.max(S.protensao.nCabos,1))*S.materiais.gamaP;
  const placa=calcularPlacaAncoragem(S,mat,sec,Pk_cabo);
  const balanceamento=calcularCargaBalanceamento(S,sec,tr,L,Pef,qTot,qg1);
  const estrategia=calcularEstrategia(S,qg1,qg2,qq,pont,L);
  const tensArmAtiva=verificarTensoesAtivas(S,mat,sec,pIni,perdas,Pef);
  const atoProtensao=verificarAtoProtensao(S,mat,sec,pIni,perdas,tr);
  return {geo:geo,sec:sec,mat:mat,pIni:pIni,perdas:perdas,Pef:Pef,Pei:Pei,
    asInf:AsInf,asSup:AsSup,qg1:qg1,qPerm:qPerm,qTot:qTot,pont:pont,
    L:L,n:n,pontos:pontos,secCrit:secCrit,secCritV:secCritV,
    flexao:flexao,cis:cis,anc:ancSimples,placa:placa,balanceamento:balanceamento,
    estrategia:estrategia,Mr:Mr,MaMax:MaMax,
    tensArmAtiva:tensArmAtiva,atoProtensao:atoProtensao,
    flecha:{grav:fGrav,perm:fPerm,var:fVar,prot:fProt,total:flechaTotal,max:flMax,xmax:xFlMax,
      alphaF:alphaF,diferida:flDif,totalDif:flTotalDiferida,limTotal:limTotal,limVar:limVar,EI:EI_gross,
      maxVar:fVar.dmax,maxGrav:fGrav.dmax,maxProt:fProt.dmax}};
}

/* ---------- TESTES DO MOTOR ---------- */
function testesMotor(){

    t.push({nome:'Área seção retangular',esp:0.30*0.60,calc:s.A,un:'m²',

    t.push({nome:'CG seção retangular',esp:0.30,calc:s.ycg,un:'m',
      erro:Math.abs(s.ycg-0.30)/0.30,ok:Math.abs(s.ycg-0.30)<1e-9});
    t.push({nome:'Ix seção retangular',esp:0.30*Math.pow(0.60,3)/12,calc:s.Ix,un:'m⁴',
      erro:Math.abs(s.Ix-0.30*Math.pow(0.60,3)/12)/(0.30*Math.pow(0.60,3)/12),
      ok:Math.abs(s.Ix-0.30*Math.pow(0.60,3)/12)<1e-9});
    const gT={tipo:'T',h:0.80,bw:0.20,bfTop:0.80,hfTop:0.15,bfBot:0.2,hfBot:0.1};
    const sT=calcularSecao(gT);
    const AT=0.20*(0.80-0.15)+0.80*0.15;
    t.push({nome:'Área seção T',esp:AT,calc:sT.A,un:'m²',
      erro:Math.abs(sT.A-AT)/AT,ok:Math.abs(sT.A-AT)<1e-9});
    const L=10,q=20;
    const e0=esforcosGrav(0,L,q,[]);
    t.push({nome:'Reação de apoio (q·L/2)',esp:q*L/2,calc:e0.V,un:'kN',
      erro:Math.abs(e0.V-q*L/2)/(q*L/2),ok:Math.abs(e0.V-q*L/2)<1e-9});
    const eM=esforcosGrav(L/2,L,q,[]);

      erro:Math.abs(eM.M-q*L*L/8)/(q*L*L/8),ok:Math.abs(eM.M-q*L*L/8)<1e-9});
    const tr={tipo:'parabolica',eApoio:0.05,eMeio:0.35};
    t.push({nome:'e(L/2)=e_meio',esp:tr.eMeio,calc:excentricidade(L/2,L,tr),un:'m',
      erro:Math.abs(excentricidade(L/2,L,tr)-tr.eMeio)/tr.eMeio,
      ok:Math.abs(excentricidade(L/2,L,tr)-tr.eMeio)<1e-12});
    t.push({nome:'e(0)=e_apoio',esp:tr.eApoio,calc:excentricidade(0,L,tr),un:'m',
      erro:Math.abs(excentricidade(0,L,tr)-tr.eApoio)/tr.eApoio,
      ok:Math.abs(excentricidade(0,L,tr)-tr.eApoio)<1e-12});
    t.push({nome:'w = 8·e·P/L²',esp:8*0.35*1000/(10*10),calc:8*0.35*1000/(10*10),un:'kN/m',erro:0,ok:true});
    t.push({nome:'Área Ø12,5 (tabela)',esp:1.25,calc:areaDaBitola(12.5),un:'cm²',
      erro:Math.abs(areaDaBitola(12.5)-1.25)/1.25,ok:Math.abs(areaDaBitola(12.5)-1.25)<1e-9});
    t.push({nome:'Área Ø10,0 (tabela)',esp:0.80,calc:areaDaBitola(10),un:'cm²',
      erro:Math.abs(areaDaBitola(10)-0.80)/0.80,ok:Math.abs(areaDaBitola(10)-0.80)<1e-9});
    t.push({nome:'Área Ø16,0 (tabela)',esp:2.00,calc:areaDaBitola(16),un:'cm²',
      erro:Math.abs(areaDaBitola(16)-2.00)/2.00,ok:Math.abs(areaDaBitola(16)-2.00)<1e-9});
  }catch(e){
    t.push({nome:'Erro no motor',esp:'—',calc:e.message,un:'—',erro:1,ok:false});
  }
  return t;
}

/* ---------- GRÁFICOS ---------- */
class Grafico{
  constructor(cv){ this.cv=cv; this.ctx=cv.getContext('2d'); this.cfg=null; this.hover=null; this._bind(); }
  _bind(){
    const self=this;
    this.cv.addEventListener('mousemove',e=>self._move(e));
    this.cv.addEventListener('mouseleave',()=>{self.hover=null;self.draw();});
    this.cv.addEventListener('touchmove',e=>{ if(e.touches.length){ self._move(e.touches[0]); e.preventDefault(); } },{passive:false});
    this.cv.addEventListener('touchend',()=>{self.hover=null;self.draw();});
    if(window.ResizeObserver){ try{ this._ro=new ResizeObserver(()=>{ if(this.cfg) this.draw(); }); this._ro.observe(this.cv.parentElement); }catch(e){} }
  }
  _move(ev){ if(!this.cfg) return; const r=this.cv.getBoundingClientRect(); this.hover=ev.clientX-r.left; this.draw(); }
  set(cfg){ this.cfg=cfg; this.draw(); }
  _size(){
    const parent=this.cv.parentElement; void this.cv.offsetHeight;
    const r=this.cv.getBoundingClientRect();
    let w=Math.max(0,Math.round(r.width||0));
    if(w<60) w=Math.max(0,Math.round((parent?parent.clientWidth:0)-16));
    if(w<60) w=700;
    const hAttr=parseInt(this.cv.getAttribute('height')||'260',10);
    const h=Math.max(180,hAttr);
    const dpr=Math.min(2,window.devicePixelRatio||1);
    this.cv.width=Math.round(w*dpr); this.cv.height=Math.round(h*dpr);
    this.cv.style.width='100%'; this.cv.style.height=h+'px';
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.W=w; this.H=h;
  }
  draw(){
    if(!this.cfg) return;
    this._size();
    const ctx=this.ctx,W=this.W,H=this.H,cfg=this.cfg;
    ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    const pad={l:64,r:14,t:12,b:38};
    const pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;
    if(pw<40||ph<40) return;
    let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;
    cfg.series.forEach(s=>{ s.points.forEach(p=>{
      if(!isFinite(p.x)||!isFinite(p.y)) return;
      if(p.x<xmin)xmin=p.x; if(p.x>xmax)xmax=p.x; if(p.y<ymin)ymin=p.y; if(p.y>ymax)ymax=p.y; }); });
    if(!isFinite(xmin)){ xmin=0;xmax=1;ymin=0;ymax=1; }
    if(xmax-xmin<1e-9) xmax=xmin+1;
    if(ymax-ymin<1e-9){ ymax=ymin+Math.abs(ymin||1)*0.1+0.1; ymin-=0.1; }
    if(cfg.zeroLine!==false){ if(ymin>0 && ymin<(ymax-ymin)*0.35) ymin=0; if(ymax<0 && Math.abs(ymax)<(ymax-ymin)*0.35) ymax=0; }
    const padY=(ymax-ymin)*0.08; ymin-=padY; ymax+=padY;
    const X=v=>pad.l+(v-xmin)/(xmax-xmin)*pw;
    const Y=v=>pad.t+ph-(v-ymin)/(ymax-ymin)*ph;
    ctx.strokeStyle='#eaf0f7'; ctx.lineWidth=1;
    for(let i=0;i<=5;i++){ const yv=ymin+(ymax-ymin)*i/5; ctx.beginPath(); ctx.moveTo(pad.l,Y(yv)); ctx.lineTo(pad.l+pw,Y(yv)); ctx.stroke(); }
    for(let i=0;i<=5;i++){ const xv=xmin+(xmax-xmin)*i/5; ctx.beginPath(); ctx.moveTo(X(xv),pad.t); ctx.lineTo(X(xv),pad.t+ph); ctx.stroke(); }
    ctx.strokeStyle='#8aa2bb'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,pad.t+ph); ctx.lineTo(pad.l+pw,pad.t+ph); ctx.stroke();
    if(ymin<0&&ymax>0){ ctx.strokeStyle='#b9c7d6'; ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(pad.l,Y(0)); ctx.lineTo(pad.l+pw,Y(0)); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle='#5b6b7f'; ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign='right'; ctx.textBaseline='middle';
    for(let i=0;i<=5;i++){ const yv=ymin+(ymax-ymin)*i/5; ctx.fillText(fmt(yv,Math.abs(ymax-ymin)>100?0:2),pad.l-6,Y(yv)); }
    ctx.textAlign='center'; ctx.textBaseline='top';
    for(let i=0;i<=5;i++){ const xv=xmin+(xmax-xmin)*i/5; ctx.fillText(fmt(xv,1),X(xv),pad.t+ph+6); }
    ctx.fillStyle='#94a3b8'; ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.textAlign='center'; ctx.fillText(cfg.xLabel||'',pad.l+pw/2,H-13);
    ctx.save(); ctx.translate(12,pad.t+ph/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.fillText(cfg.yLabel||'',0,0); ctx.restore();
    cfg.series.forEach(s=>{
      ctx.strokeStyle=s.color; ctx.lineWidth=s.width||1.8; ctx.setLineDash(s.dash||[]); ctx.beginPath();
      let started=false;

      ctx.stroke(); ctx.setLineDash([]);
    });
    if(cfg.annotate!==false){
      const all=cfg.series.filter(s=>!s.noAnnot).flatMap(s=>s.points);
      if(all.length){
        const mx=all.reduce((a,b)=>b.y>a.y?b:a, all[0]);
        const mn=all.reduce((a,b)=>b.y<a.y?b:a, all[0]);
        ctx.font='bold 9.5px -apple-system,Segoe UI,Roboto,sans-serif';

        ctx.fillText('mín '+fmt(mn.y,2)+' @ x='+fmt(mn.x,2),X(mn.x)+5,Y(mn.y)+11);
      }
    }
    let lx=pad.l+6,ly=pad.t+4;
    ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
    cfg.series.forEach(s=>{
      const w=ctx.measureText(s.name).width+22;
      if(lx+w>pad.l+pw){ lx=pad.l+6; ly+=13; }
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fillRect(lx-2,ly-2,w,12);
      ctx.strokeStyle=s.color; ctx.lineWidth=2.4;

      ctx.fillStyle='#33475e'; ctx.textAlign='left'; ctx.textBaseline='middle';
      ctx.fillText(s.name,lx+16,ly+5);
      lx+=w+6;
    });
    if(this.hover!==null && this.hover>=pad.l && this.hover<=pad.l+pw){
      const xv=xmin+(this.hover-pad.l)/pw*(xmax-xmin);
      ctx.strokeStyle='#00b4d8'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
      ctx.beginPath(); ctx.moveTo(this.hover,pad.t); ctx.lineTo(this.hover,pad.t+ph); ctx.stroke(); ctx.setLineDash([]);
      const vals=[];
      cfg.series.forEach(s=>{
        let best=null,bd=Infinity;
        s.points.forEach(p=>{ const dd=Math.abs(p.x-xv); if(dd<bd){ bd=dd; best=p; } });
        if(best){ ctx.fillStyle=s.color; ctx.beginPath(); ctx.arc(X(best.x),Y(best.y),3.4,0,7); ctx.fill(); vals.push({name:s.name,y:best.y,color:s.color}); }
      });

        const bw=168,bh=14+vals.length*13;
        let bx=this.hover+10; if(bx+bw>W-6) bx=this.hover-bw-10;
        const by=pad.t+6;
        ctx.fillStyle='rgba(11,37,69,.93)'; ctx.strokeStyle='#00b4d8'; ctx.lineWidth=1;
        ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(bx,by,bw,bh,6); else ctx.rect(bx,by,bw,bh); ctx.fill(); ctx.stroke();
        ctx.font='bold 10px -apple-system,Segoe UI,Roboto,sans-serif';
        ctx.fillStyle='#8fd8ea'; ctx.textAlign='left'; ctx.textBaseline='top';
        ctx.fillText('x = '+fmt(xv,3)+' m',bx+8,by+5);
        ctx.font='10px -apple-system,Segoe UI,Roboto,sans-serif';
        vals.forEach((v,i)=>{ ctx.fillStyle=v.color; ctx.fillRect(bx+8,by+21+i*13,7,7); ctx.fillStyle='#fff'; ctx.fillText(v.name+': '+fmt(v.y,3),bx+19,by+20+i*13); });
      }

function prepararCanvas(cv,alturaPadrao){
  if(!cv) return null;
  const parent=cv.parentElement;
  const parW=parent?parent.clientWidth:0;
  const r=cv.getBoundingClientRect();
  let w=Math.max(0,Math.round(r.width||0));
  if(w<60) w=Math.max(0,Math.round(parW-16));
  if(w<60) w=700;
  const h=alturaPadrao||parseInt(cv.getAttribute('height')||'300',10);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.width='100%'; cv.style.height=h+'px';
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  return {ctx:ctx,W:w,H:h};
}
function desenharSecao(){
  const cv=el('cvSecao'); if(!cv) return;
  const p=prepararCanvas(cv,330); if(!p) return;
  const {ctx,W,H}=p;
  const g=S.geometria;
  const sec=calcularSecao(g);
  const L=Math.max(0.1,g.L);
  const pad=40;
  const esc=Math.min((W-2*pad)/sec.bMax,(H-2*pad)/g.h);
  const cx=W/2;
  const xOf=b=>cx-b*esc/2;
  const yOf=y=>H-pad-y*esc;
  sec.retangulos.forEach(r=>{
    ctx.fillStyle='rgba(45,125,210,0.10)';
    ctx.fillRect(xOf(r.b),yOf(r.y0+r.h),r.b*esc,r.h*esc);
    ctx.strokeStyle='#1b5299'; ctx.lineWidth=1.6;
    ctx.strokeRect(xOf(r.b),yOf(r.y0+r.h),r.b*esc,r.h*esc);
  });
  const yCG=yOf(sec.ycg);
  ctx.strokeStyle='#00b4d8'; ctx.lineWidth=1.3; ctx.setLineDash([7,4]);
  ctx.beginPath(); ctx.moveTo(10,yCG); ctx.lineTo(W-10,yCG); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#0096c7'; ctx.font='bold 10px sans-serif'; ctx.textAlign='left';
  ctx.fillText('CG',12,yCG-5);
  if(R && R.flexao && isFinite(R.flexao.x)){
    const yLN=g.h-R.flexao.x;
    if(yLN>=0 && yLN<=g.h){
      ctx.strokeStyle='#dc2626'; ctx.lineWidth=1.1; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(10,yOf(yLN)); ctx.lineTo(W-10,yOf(yLN)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#b91c1c'; ctx.fillText('LN (ELU) x='+fmt(R.flexao.x,3)+' m',12,yOf(yLN)-5);
    }
  }
  const drawBars=(y,cor,txt,nBarras)=>{
    const n=Math.min(6,Math.max(1,nBarras));
    const larguraUtil=sec.bMax*esc*0.65;
    for(let i=0;i<n;i++){
      const xx=cx+((i-(n-1)/2)*(larguraUtil/Math.max(n-1,1)));
      ctx.beginPath(); ctx.arc(xx,yOf(y),4.5,0,7);
      ctx.fillStyle=cor; ctx.fill();
      ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.fillStyle=cor; ctx.font='bold 9px sans-serif'; ctx.textAlign='right';
    ctx.fillText(txt,W-8,yOf(y)+3);
  };
  if(S.passiva.nInf>0){
    const AsInf=(S.passiva.nInf||0)*areaDaBitola(S.passiva.fInf)*1e-4;
    drawBars(S.passiva.dInf,'#b45309','As,inf='+fmt(AsInf*1e4,2)+' cm²',S.passiva.nInf);
  }
  if(S.passiva.nSup>0){
    const AsSup=(S.passiva.nSup||0)*areaDaBitola(S.passiva.fSup)*1e-4;
    drawBars(g.h-S.passiva.dSup,'#15803d','As,sup='+fmt(AsSup*1e4,2)+' cm²',S.passiva.nSup);
  }
  const eC=excentricidade(L/2,L,S.trajetoria);
  const yC=sec.ycg-eC;
  ctx.beginPath(); ctx.arc(cx,yOf(yC),8,0,7); ctx.fillStyle='#00b4d8'; ctx.fill();
  ctx.strokeStyle='#0b2545'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,yOf(yC),3.5,0,7); ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#0b2545'; ctx.font='bold 10px sans-serif'; ctx.textAlign='left';
  ctx.fillText('Cabo e='+fmt(eC,3)+' m',cx+14,yOf(yC)+4);
  ctx.strokeStyle='#5b6b7f'; ctx.lineWidth=1; ctx.fillStyle='#5b6b7f'; ctx.font='10px sans-serif';
  ctx.textAlign='right';
  ctx.beginPath(); ctx.moveTo(W-24,yOf(g.h)); ctx.lineTo(W-24,yOf(0)); ctx.stroke();
  ctx.fillText('h='+fmt(g.h*100,1)+' cm',W-28,(yOf(g.h)+yOf(0))/2);
  ctx.textAlign='center';
  ctx.beginPath(); ctx.moveTo(xOf(sec.bMax),H-pad+14); ctx.lineTo(xOf(0),H-pad+14); ctx.stroke();
  ctx.fillText('b='+fmt(sec.bMax*100,1)+' cm',cx,H-pad+26);
}
function desenharViga(){
  const cv=el('cvViga'); if(!cv) return;
  const p=prepararCanvas(cv,300); if(!p) return;
  const {ctx,W,H}=p;
  const g=S.geometria;
  const sec=calcularSecao(g);
  const L=Math.max(0.1,g.L);
  const padL=46,padR=24,padT=40,padB=70;
  const pw=W-padL-padR,ph=H-padT-padB;
  const hEsc=Math.min(ph/(g.h*1.7),320);
  const xOf=x=>padL+(x/L)*pw;
  const yCG=padT+ph/2;
  ctx.strokeStyle='#b9c7d6'; ctx.lineWidth=1; ctx.setLineDash([5,4]);
  ctx.beginPath(); ctx.moveTo(padL,yCG); ctx.lineTo(padL+pw,yCG); ctx.stroke(); ctx.setLineDash([]);
  const hPix=g.h*hEsc;
  ctx.fillStyle='rgba(45,125,210,0.07)';
  ctx.strokeStyle='#1b5299'; ctx.lineWidth=1.4;
  ctx.fillRect(padL,yCG-hPix*sec.ysup/g.h,pw,hPix);
  ctx.strokeRect(padL,yCG-hPix*sec.ysup/g.h,pw,hPix);
  const yBase=yCG-hPix*sec.ysup/g.h+hPix;
  ctx.fillStyle='#0b2545';
  ctx.beginPath(); ctx.moveTo(padL,yBase); ctx.lineTo(padL-13,yBase+18); ctx.lineTo(padL+13,yBase+18); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(padL,yBase,5,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(padL,yBase,2,0,7); ctx.fill();
  ctx.fillStyle='#0b2545'; ctx.fillRect(padL+pw-14,yBase,28,9);
  ctx.beginPath(); ctx.arc(padL+pw,yBase,5,0,7); ctx.fill();
  ctx.strokeStyle='#00b4d8'; ctx.lineWidth=2.6; ctx.beginPath();
  for(let i=0;i<=120;i++){
    const x=i/120*L;
    const e=excentricidade(x,L,S.trajetoria);
    const y=yCG+e*hEsc;
    if(i===0) ctx.moveTo(xOf(x),y); else ctx.lineTo(xOf(x),y);
  }
  ctx.stroke();
  ctx.fillStyle='#0096c7';
  [0,1].forEach(k=>{
    const x=k?L:0;
    const e=excentricidade(x,L,S.trajetoria);
    ctx.beginPath(); ctx.arc(xOf(x),yCG+e*hEsc,6,0,7); ctx.fill();
    ctx.strokeStyle='#0b2545'; ctx.lineWidth=1.3; ctx.stroke();
  });
  const qTotExib=R?R.qTot:(sec.A*S.materiais.gamaConc+S.acoes.g2+S.acoes.q);
  if(qTotExib>0){
    ctx.strokeStyle='#b45309'; ctx.lineWidth=1.4;
    const yTop=yCG-hPix*sec.ysup/g.h-22;
    ctx.beginPath(); ctx.moveTo(padL,yTop); ctx.lineTo(padL+pw,yTop); ctx.stroke();
    for(let i=0;i<=24;i++){ const xx=padL+i*pw/24; ctx.beginPath(); ctx.moveTo(xx,yTop); ctx.lineTo(xx,yTop+13); ctx.stroke(); }
    ctx.fillStyle='#b45309'; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('q total = '+fmt(qTotExib,2)+' kN/m',padL+pw/2,yTop-6);
  }
  const pont=cargasPontuais(S.acoes);
  pont.forEach(pp=>{
    const xx=xOf(pp.a),yTop=yCG-hPix*sec.ysup/g.h-16;
    ctx.strokeStyle='#b91c1c'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(xx,yTop-26); ctx.lineTo(xx,yTop); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(xx,yTop); ctx.lineTo(xx-6,yTop-11); ctx.lineTo(xx+6,yTop-11);
    ctx.closePath(); ctx.fillStyle='#b91c1c'; ctx.fill();
  });
  ctx.strokeStyle='#5b6b7f'; ctx.lineWidth=1; ctx.fillStyle='#5b6b7f'; ctx.font='10px sans-serif';
  ctx.textAlign='center';
  const yDim=yBase+34;
  ctx.beginPath(); ctx.moveTo(padL,yDim); ctx.lineTo(padL+pw,yDim); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL,yDim-5); ctx.lineTo(padL,yDim+5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL+pw,yDim-5); ctx.lineTo(padL+pw,yDim+5); ctx.stroke();
  ctx.fillText('L = '+fmt(L,2)+' m',padL+pw/2,yDim+16);
}
function desenharDeformacoes(){

  const pad=50,esc=Math.min((H-2*pad)/h,300);

function desenharComRetry(id){

function montarAbas(){
  const nav=el('tabs'); nav.innerHTML='';
  ABAS.forEach((a,i)=>{
    const b=document.createElement('button');
    b.textContent=a[1]; b.dataset.aba=a[0];
    if(i===0) b.classList.add('on');
    b.onclick=()=>abrirAba(a[0]);
    nav.appendChild(b);
  });
}
function abrirAba(id){
  qsa('.panel').forEach(p=> p.classList.toggle('on',p.id==='p-'+id));
  qsa('#tabs button').forEach(b=> b.classList.toggle('on',b.dataset.aba===id));
  if(id==='graficos'){ setTimeout(()=>{ try{ atualizarGraficos(); }catch(e){} },40); }
  else if(['geometria','cabos','elu','ancoragem','placa'].indexOf(id)>=0){
    desenharComRetry(id);
    if(id==='cabos') setTimeout(()=>{ try{ desenharGraficoWp(); }catch(e){} },80);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- CATÁLOGO RUDLOFF ---------- */
function aplicarCatalogoRudloff(){
  if(parseInt(S.anc.usarCatalogo,10)!==1){ const d=el('infoRudloff'); if(d) d.style.display='none'; return; }
  const tipo=S.anc.tipoRudloff||'AF 5-1';
  const pl=RUDLOFF_PLACAS[tipo]; if(!pl) return;
  S.anc.a=pl.A; S.anc.b=pl.B; S.anc.C=pl.C; S.anc.nCabos=pl.cordoalhas;
  const ia=document.querySelector('[data-path="anc.a"]');
  const ib=document.querySelector('[data-path="anc.b"]');
  const iC=document.querySelector('[data-path="anc.C"]');
  const iN=document.querySelector('[data-path="anc.nCabos"]');
  if(ia) ia.value=pl.A; if(ib) ib.value=pl.B; if(iC) iC.value=pl.C; if(iN) iN.value=pl.cordoalhas;
  const d=el('infoRudloff'); if(d) d.style.display='block';
  const e1=el('rlTipo'); if(e1) e1.textContent=tipo;
  const e2=el('rlCord'); if(e2) e2.textContent='Ø'+pl.cordoalha+' mm';
  const e3=el('rlPeso'); if(e3) e3.textContent=fmt(pl.peso,2);
  const e4=el('rlNCord'); if(e4) e4.textContent=pl.cordoalhas;
}

/* ---------- Bind ---------- */
function ligarInputs(){
  qsa('[data-path]').forEach(elm=>{
    const path=elm.dataset.path;
    const handler = ()=>{
      let v;
      if(elm.type==='number'){ v=(elm.value==='')?0:parseFloat(elm.value); }
      else if(elm.tagName==='SELECT'){ v = parseFloat(elm.value) || 0; }
      else v = elm.value;
      setPath(S,path,v);
      if(path.indexOf('passiva.f')===0 || path.indexOf('passiva.n')===0
         || path === 'estribo.phi' || path.indexOf('anc.phi')===0){
        try{ atualizarHintsBitolas(); }catch(e){}
      }
      if(path.indexOf('geometria')===0 || path.indexOf('passiva')===0
         || path.indexOf('protensao')===0 || path.indexOf('anc')===0){
        try{ desenharSecao(); }catch(e){}
        try{ renderSecao(); }catch(e){}
        if(path.indexOf('geometria')===0){
          const s2=calcularSecao(S.geometria);
          const qg1=s2.A*S.materiais.gamaConc;
          const i=el('inG1'); if(i) i.value=fmt(qg1,3);
        }
      }
      if(path.indexOf('trajetoria')===0){
        try{ desenharViga(); }catch(e){}
        try{ desenharGraficoWpPreview(); }catch(e){}
      }
      if(path.indexOf('acoes')===0){ try{ desenharViga(); }catch(e){} }
      if(path==='anc.tipoRudloff' || path==='anc.usarCatalogo'){ aplicarCatalogoRudloff(); }
    };
    elm.addEventListener('input', handler);
    elm.addEventListener('change', handler);
    const v=getPath(S,path);
    if(elm.tagName==='SELECT') elm.value=String(v);
    else if(elm.type==='number') elm.value=v;
    else elm.value=(v==null?'':v);
  });
  try{ inicializarSelectsBitolas(); }catch(e){ console.warn(e); }
}
function sincronizarInputs(){
  qsa('[data-path]').forEach(elm=>{
    const v=getPath(S,elm.dataset.path);

}

function renderEstrategia(){
  if(!R||!R.estrategia) return;
  const es=R.estrategia, b=R.balanceamento;
  const bal=parseInt(S.estrategia.balancearPP,10)===1;
  const g1_maj=es.g1_maj, wp=b.wp;
  const ratio=g1_maj>0?(wp/g1_maj)*100:0;
  const resid=g1_maj-wp;
  let cls='', msg='';
  if(!bal){ cls='na'; msg='Modo tradicional.'; }
  else if(ratio>=95&&ratio<=105){ cls='ok'; msg='Cabo praticamente equilibra γg·g1.'; }
  else if(ratio>=80&&ratio<95){ cls='hi'; msg='Balanceamento parcial — resíduo '+fmt(resid,2)+' kN/m.'; }
  else if(ratio>105&&ratio<=130){ cls='warn'; msg='Leve excesso — risco de contra-flecha.'; }
  else if(ratio>130){ cls='bad'; msg='Balanceamento excessivo (>30%).'; }
  else { cls='warn'; msg='Balanceamento abaixo do peso próprio.'; }
  let maxResid=0; es.pontos.forEach(p=>{ if(Math.abs(p.Mresidual)>maxResid) maxResid=Math.abs(p.Mresidual); });
  const o=el('outEstrategia'); if(o) o.innerHTML=
    box('γg · g1',fmt(g1_maj,3),'kN/m')+
    box('w = 8·e·P/L²',fmt(wp,3),'kN/m')+
    box('w / (γg·g1)',fmt(ratio,1),'%',cls==='ok'?'ok':(cls==='bad'?'bad':'warn'))+
    box('Residual p/ passiva',fmt(resid,3),'kN/m')+
    box('γg·g2+γq·q',fmt(es.qResidual_maj,3),'kN/m')+
    box('Msd residual (passiva)',fmt(maxResid,1),'kN·m');
  const a=el('alertasEstrategia'); if(a) a.innerHTML=alerta(cls==='ok'?'s':(cls==='bad'?'e':'i'),
    bal?'Cabo balanceia γg·g1, passiva absorve o resto':'Estratégia tradicional', msg);
}

function recomputarPontosComb(){
  if(R && R.pontos && R.pontos.length){
    const p0=R.pontos[0];
    if(isFinite(p0.Mra) && isFinite(p0.Melu) && isFinite(p0.Velu)) return R.pontos;
  }
  try{
    const geo=S.geometria, pr=S.protensao, tr=S.trajetoria;
    const L=Math.max(0.1,geo.L);
    const sec=calcularSecao(geo);
    const mat=calcularMateriais(S.materiais,S.materiais.idade);
    const pIni=calcularProtensaoInicial(S);
    const perdas=calcularPerdas(S,mat,sec,pIni,tr,L);
    const qg1=sec.A*S.materiais.gamaConc;
    const qg2=S.acoes.g2,qq=S.acoes.q;
    const pont=cargasPontuais(S.acoes);
    const n=parseInt(S.discretizacao,10)||100, dx=L/n;
    const pontos=[];
    const dP_ac=isFinite(perdas.ac.dP)?perdas.ac.dP:0;
    const dP_el=isFinite(perdas.dPEl)?perdas.dPEl:0;
    const dP_pr=isFinite(perdas.dPProg)?perdas.dPProg:0;
    for(let i=0;i<=n;i++){
      const x=i*dx;
      const Pat=perdaAtrito(x,L,tr,pIni.P0,pr.mu,pr.k);
      let Pact=Pat.P-dP_ac*0.5-dP_el-dP_pr;
      if(!isFinite(Pact)) Pact=pIni.P0;
      Pact=Math.max(0,Pact);
      const eg1=esforcosGrav(x,L,qg1,[]);
      const eg2=esforcosGrav(x,L,qg2,[]);
      const eq=esforcosGrav(x,L,qq,[]);
      const ep=esforcosGrav(x,L,0,pont);
      const e=excentricidade(x,L,tr);
      const Mp=-Pact*e;
      const Vp=cortanteProtensao(x,L,tr,Pact);
      const Mqp=eg1.M+eg2.M+S.acoes.psi2*(eq.M+ep.M)+Mp;
      const Mfr=eg1.M+eg2.M+S.acoes.psi1*(eq.M+ep.M)+Mp;
      const Mra=eg1.M+eg2.M+eq.M+ep.M+Mp;
      const Melu=S.acoes.gamaG*(eg1.M+eg2.M+ep.M)+S.acoes.gamaQ*eq.M+Math.min(S.materiais.gamaP*Mp,0.9*Mp);
      const Vgrav=S.acoes.gamaG*(eg1.V+eg2.V+ep.V)+S.acoes.gamaQ*eq.V;
      const Velu=Vgrav+S.materiais.gamaP*Vp;
      const N0=v=>isFinite(v)?v:0;
      pontos.push({x:x,P:N0(Pact),e:N0(e),
        Mg1:N0(eg1.M),Mg2:N0(eg2.M),Mq:N0(eq.M),Mpont:N0(ep.M),
        Mqp:N0(Mqp),Mfr:N0(Mfr),Mra:N0(Mra),Melu:N0(Melu),Mp:N0(Mp),
        Vg1:N0(eg1.V),Vg2:N0(eg2.V),Vq:N0(eq.V),Vponto:N0(ep.V),Vp:N0(Vp),Velu:N0(Velu),
        sSup:0,sInf:0,sSupRara:0,sInfRara:0,sCabo:0});
    }
    return pontos;
  }catch(e){ console.error('Falha recomputar:',e); return []; }
}

  let h2='<thead><tr><th>Combinação</th><th>M (kN·m)</th><th>V (kN)</th><th>N (kN)</th><th>σsup</th><th>σinf</th><th>x (m)</th></tr></thead><tbody>';
  h2+=linhaComb(maxRara,'Rara',true);

  h2+=linhaComb(maxElu,'ELU (máx)',true);

  if(tb2) tb2.innerHTML=h2+'</tbody>';

  const tbDet=el('tbEsfCombDetalhada');
  if(tbDet){
    let h3='<thead><tr><th>x (m)</th><th>M rara</th><th>M freq</th><th>M qp</th><th>M ELU</th><th>V ELU</th><th>N (kN)</th></tr></thead><tbody>';
    const step=Math.max(1,Math.floor(pontos.length/25));
    pontos.forEach((q,i)=>{
      if(i%step!==0 && i!==pontos.length-1) return;
      h3+='<tr><td class="num">'+fmt(q.x,2)+'</td><td class="num">'+fmt(q.Mra,2)+'</td><td class="num">'+fmt(q.Mfr,2)+

         '</td><td class="num">'+fmt(q.Velu,2)+'</td><td class="num">'+fmt(q.P,1)+'</td></tr>';
    });
    tbDet.innerHTML=h3+'</tbody>';
  }
}

  if(!R) return;
  const f=R.flexao;
  const sit=f.dominio==='4'?'bad':(f.utilizacao<=1?(f.utilizacao>0.95?'warn':'ok'):'bad');
  const o=el('outELU'); if(o) o.innerHTML=

function montarResumo(){
  const res=[];
  if(!R) return res;
  const f=R.flexao,c=R.cis,fl=R.flecha,pl=R.placa,t=R.tensArmAtiva,a=R.atoProtensao;
  res.push({nome:'Flexão ELU',sol:f.Msd,res:f.Mrd,un:'kN·m',util:f.utilizacao,
    sit:f.dominio==='4'?'NAO':(f.utilizacao<=1.0?(f.utilizacao>0.95?'ATENCAO':'OK'):'NAO'),
    obs:f.dominio==='4'?'Domínio 4 — ruptura frágil':('Domínio '+f.dominio)});
  res.push({nome:'Cisalhamento (VRd2)',sol:c.Vsd,res:c.VRd2,un:'kN',util:c.utilCorte,
    sit:c.Vsd<=c.VRd2?(c.utilCorte>0.9?'ATENCAO':'OK'):'NAO',obs:'Biela comprimida'});
  res.push({nome:'Cisalhamento (VRd3)',sol:c.Vsd,res:c.VRd3,un:'kN',util:c.utilFlex,
    sit:c.Vsd<=c.VRd3?(c.utilFlex>0.9?'ATENCAO':'OK'):'NAO',obs:'Tração diagonal'});
  let maxSup=Infinity,maxInf=-Infinity,minInf=Infinity;
  R.pontos.forEach(p=>{ if(p.sSup<maxSup) maxSup=p.sSup; if(p.sInf>maxInf) maxInf=p.sInf; if(p.sInf<minInf) minInf=p.sInf; });
  const limComp=0.6*R.mat.fck,limTrac=R.mat.fctm;
  const utilComp=Math.max(Math.abs(maxSup),Math.abs(minInf))/limComp;
  res.push({nome:'Compressão (quase perm.)',sol:Math.max(Math.abs(maxSup),Math.abs(minInf)),res:limComp,un:'MPa',
    util:utilComp,sit:utilComp<=1.0?(utilComp>0.9?'ATENCAO':'OK'):'NAO',obs:'Limite 0,6·fck'});
  const tracMax=Math.max(0,maxInf);
  res.push({nome:'Tração na fibra inferior',sol:tracMax,res:limTrac,un:'MPa',util:tracMax/limTrac,
    sit:tracMax<=0?'OK':(tracMax<=limTrac?'ATENCAO':'NAO'),obs:tracMax<=0?'Seção comprimida':'Verificar ELS-F'});
  res.push({nome:'Tensão na armadura (σpi)',sol:t.sigmaPi,res:t.limPi,un:'MPa',util:t.utilPi,
    sit:t.sitPi,obs:'NBR 6118:2023 §9.6.1.2.1 — '+t.classe});
  res.push({nome:'Tensão na armadura (σp0)',sol:t.sigmaP0,res:t.limPo,un:'MPa',util:t.utilPo,
    sit:t.sitPo,obs:'NBR 6118:2023 §9.6.1.2.2 — após perdas imediatas'});
  res.push({nome:'Compressão no ato',sol:Math.max(Math.abs(a.sigmaSup_P),Math.abs(a.sigmaInf_P)),res:a.limComp,un:'MPa',
    util:a.utilComp,sit:a.sitComp,obs:'NBR 6118:2023 §9.6.1.3 — 0,70·fckj'});
  res.push({nome:'Tração no ato',sol:Math.max(0,a.sigmaSup_P,a.sigmaInf_P),res:a.limTrac,un:'MPa',
    util:a.utilTrac,sit:a.sitTrac,obs:'NBR 6118:2023 §9.6.1.3 — 1,2·fct,m'});
  const flAbs=Math.abs(fl.totalDif);
  res.push({nome:'Flecha total (diferida)',sol:flAbs,res:fl.limTotal,un:'m',util:flAbs/fl.limTotal,
    sit:flAbs<=fl.limTotal?(flAbs/fl.limTotal>0.9?'ATENCAO':'OK'):'NAO',obs:'Limite L/250'});
  const flVarAbs=Math.abs(fl.maxVar);
  res.push({nome:'Flecha por carga variável',sol:flVarAbs,res:fl.limVar,un:'m',util:flVarAbs/fl.limVar,
    sit:flVarAbs<=fl.limVar?(flVarAbs/fl.limVar>0.9?'ATENCAO':'OK'):'NAO',obs:'Limite L/350'});
  res.push({nome:'Formação de fissuras',sol:R.MaMax,res:R.Mr,un:'kN·m',util:R.MaMax/R.Mr,
    sit:R.MaMax<=R.Mr?'OK':'ATENCAO',obs:R.MaMax<=R.Mr?'Mserv < Mr':'Mserv > Mr'});
  res.push({nome:'Perdas de protensão',sol:R.perdas.perdaTotalPct,res:30,un:'%',util:R.perdas.perdaTotalPct/30,
    sit:R.perdas.perdaTotalPct<=30?(R.perdas.perdaTotalPct>25?'ATENCAO':'OK'):'NAO',obs:'Referência: ≤ 30%'});
  res.push({nome:'Placa de ancoragem',sol:pl.sigmaLocal,res:pl.fcdLocal,un:'MPa',util:pl.utilLocal,
    sit:pl.utilLocal<=1.0?(pl.utilLocal>0.9?'ATENCAO':'OK'):'NAO',obs:'NBR 6118:2023 §21.2'});
  res.push({nome:'Fretagem (bursting + spalling)',sol:pl.As_total,res:pl.As_fret_exist+pl.As_spall_exist,un:'mm²',
    util:pl.utilTotal,sit:pl.utilTotal<=1.0?(pl.utilTotal>0.9?'ATENCAO':'OK'):'NAO',
    obs:'As proposto ≥ As necessário'});
  if(R.balanceamento){
    const b=R.balanceamento;
    res.push({nome:'Balanceamento (w/q_total)',sol:b.pct,res:100,un:'%',util:b.pct/100,
      sit:(b.pct>=60&&b.pct<=110)?(b.pct>=80?'OK':'ATENCAO'):'ATENCAO',
      obs:'w = '+fmt(b.wp,3)+' ; residual '+fmt(b.qResidual,3)});
    let sitPP='OK';
    if(b.pctPP>=80&&b.pctPP<=120) sitPP='OK';
    else if(b.pctPP>=60&&b.pctPP<80) sitPP='ATENCAO';
    else if(b.pctPP>120&&b.pctPP<=150) sitPP='ATENCAO';
    else if(b.pctPP<60) sitPP='ATENCAO';
    else sitPP='NAO';
    res.push({nome:'Balanceamento (w/g1)',sol:b.pctPP,res:100,un:'%',util:b.pctPP/100,sit:sitPP,
      obs:'g1='+fmt(b.qg1,3)+' ; w='+fmt(b.wp,3)});
  }
  res.push({nome:'Abertura de fissuras (wk)',sol:null,res:null,un:'mm',util:null,sit:'NAO_IMP',obs:'Não implementado'});
  res.push({nome:'Fadiga',sol:null,res:null,un:'—',util:null,sit:'NAO_IMP',obs:'Não implementado'});
  res.push({nome:'ELS-D (descompressão)',sol:null,res:null,un:'—',util:null,sit:'NAO_IMP',obs:'Não implementado'});
  return res;
}

function renderWp(){
  if(!R||!R.balanceamento) return;
  const b=R.balanceamento;
  const sitQ=(b.pct>=60&&b.pct<=110)?(b.pct>=80?'ok':'hi'):'warn';
  let sitPP='ok', labelPP='Ideal';
  if(b.pctPP>=80&&b.pctPP<=120){ sitPP='ok'; labelPP='w ≈ peso próprio (ideal)'; }
  else if(b.pctPP>=60&&b.pctPP<80){ sitPP='hi'; labelPP='Balanceamento parcial'; }
  else if(b.pctPP>120&&b.pctPP<=150){ sitPP='warn'; labelPP='Contra-flecha elevada'; }
  else if(b.pctPP<60){ sitPP='warn'; labelPP='Balanceamento baixo'; }
  else { sitPP='bad'; labelPP='Excessivo (>1,5·g1)'; }
  const o=el('outWp'); if(o) o.innerHTML=
    box('P∞',fmt(b.P,1),'kN')+box('e',fmt(b.eMeio,4),'m')+box('L',fmt(b.L,2),'m')+
    box('w = 8·e·P/L²',fmt(b.wp,3),'kN/m','hi')+
    box('g1 = A·γc',fmt(b.qg1,3),'kN/m')+
    box('w/g1',fmt(b.pctPP,1),'%',sitPP)+
    box('Classificação',labelPP,'',sitPP)+
    box('Residual g1−w',fmt(b.resPP,3),'kN/m')+
    box('q total',fmt(b.qExt,3),'kN/m')+
    box('w/q_total',fmt(b.pct,1),'%',sitQ)+
    box('Residual q−w',fmt(b.qResidual,3),'kN/m');
  let al='';
  if(b.pctPP>=80&&b.pctPP<=120) al+=alerta('s','Balanceamento IDEAL','w ≈ g1 ('+fmt(b.pctPP,1)+'%).');
  else if(b.pctPP>=60&&b.pctPP<80) al+=alerta('i','Balanceamento parcial','w = '+fmt(b.pctPP,1)+'% de g1.');
  else if(b.pctPP>120&&b.pctPP<=150) al+=alerta('w','Contra-flecha elevada','w = '+fmt(b.pctPP,1)+'% de g1.');

  else al+=alerta('w','Balanceamento baixo','w = '+fmt(b.pctPP,1)+'% de g1.');
  const aa=el('alertasWp'); if(aa) aa.innerHTML=al;
}

function atualizarGraficoNM(){
  if(!R||!R.flexao) return;
  try{
    const f=R.flexao,pts=[],n=40;
    const Es=S.passiva.Es, fyd=f.fyd;
    for(let i=1;i<=n;i++){
      const x=(i/n)*0.95*R.geo.h;
      if(x<=0||x>=R.geo.h) continue;
      const bl=forcaCompressao(R.sec,x,f.lambda,f.alphaC,R.mat.fcd,R.geo.h);
      const epsC=Math.min(3.5,(x<=f.x23)?10*x/(f.d-x):3.5)/1000;
      const ssRaw=Es*epsC*(f.d-x)/x;
      const ss=Math.sign(ssRaw)*Math.min(Math.abs(ssRaw),fyd);
      const T=f.AsInf*ss*1000;
      const N=bl.C-T-R.perdas.Pinf;
      const M=T*(f.d-x)+bl.C*(x-bl.yC)-R.perdas.Pinf*(f.dp-x);
      if(!isFinite(N)||!isFinite(M)) continue;
      pts.push({x:M,y:N});
    }
    const g=graf('chNM');
    if(g&&pts.length) g.set({xLabel:'M (kN·m)',yLabel:'N (kN)',
      series:[{name:'Diagrama N×M',color:'#1b5299',points:pts}]});
  }catch(e){ console.warn('Falha N×M:',e); }
}

/* ---------- FLUXO PRINCIPAL ---------- */
function validarEntradas(){
  const e=[]; const g=S.geometria,m=S.materiais,p=S.protensao;
  if(!(g.L>0)) e.push('Vão L deve ser > 0.');
  if(!(g.h>0)) e.push('Altura h deve ser > 0.');
  if(!(g.bw>0)) e.push('Largura bw deve ser > 0.');
  if(g.tipo==='T'&&!(g.bfTop>g.bw)) e.push('Seção T: bfTop > bw.');
  if(g.tipo==='I'&&!(g.bfBot>0)) e.push('Seção I: bfBot > 0.');
  if(g.cobrimento>=g.h/2) e.push('Cobrimento incompatível.');
  if(S.passiva.dInf>=g.h) e.push("d' maior que altura.");
  if(!(m.fck>=20)) e.push('fck mínimo 20 MPa.');
  if(!(p.fpk>0)) e.push('fpk > 0.');
  if(!(p.Ap>0)) e.push('Ap > 0.');
  if(!(p.nCabos>=1&&p.nCordoalhas>=1)) e.push('Cabos e cordoalhas ≥ 1.');
  if(p.tensaoPct>0.80) e.push('σp0 > 80% fpk.');
  if(p.tensaoPct<0.50) e.push('σp0 < 50% fpk.');
  const eA=S.trajetoria.eApoio,eM=S.trajetoria.eMeio;
  if(eA<0||eM<0) e.push('Excentricidades positivas.');
  if(eA>g.h*0.45||eM>g.h*0.45) e.push('Excentricidade incompatível com h.');
  if(S.acoes.gamaG<1||S.acoes.gamaQ<1) e.push('γg e γq ≥ 1,0.');
  if(S.materiais.phi<0) e.push('φ ≥ 0.');
  if(!(S.anc.a>0&&S.anc.b>0)) e.push('Dimensões da placa > 0.');
  if(S.anc.a>g.bw*1000) e.push('Largura da placa > largura da alma.');
  if(!(S.anc.nCabos>=1)) e.push('Nº de cabos na ancoragem ≥ 1.');
  return e;
}
function executarCalculo(){
  const errs=validarEntradas();
  if(errs.length){ alert('Corrija os problemas antes de calcular:\n\n• '+errs.join('\n• ')); return; }
  try{ R=calcularTudo(); }
  catch(e){
    console.error('Erro no motor:',e);
    alert('Erro no motor de cálculo: '+e.message);
    return;
  }
  const etapas=[
    ['Secção',renderSecao],['Materiais',renderMateriais],['Protensão',renderProtensao],
    ['Ações',renderAcoes],['Estratégia',renderEstrategia],
    ['Combinações',renderCombinacoes],['Análise',renderAnalise],
    ['ELU',renderELU],['ELS',renderELS],['Flecha',renderFlecha],['Cisalhamento',renderCisalhamento],
    ['Placa de ancoragem',renderPlaca],['Ancoragem',renderAncoragem],
    ['Tensões NBR',renderTensoesNBR],
    ['Balanceamento w',renderWp],
    ['Resumo',renderResumo],['Testes',renderTestes],
    ['Desenho da seção',desenharSecao],['Elevação da viga',desenharViga],
    ['Deformações',desenharDeformacoes],['Placa (esquema)',desenharPlaca],
    ['Ancoragem (esquema)',desenharAncoragem],
    ['Gráficos',atualizarGraficos],
    ['Gráfico wp',desenharGraficoWp],
    ['Memória',gerarMemoria]
  ];
  const falhas=[];
  etapas.forEach(([nome,fn])=>{
    try{ fn(); }catch(e){ falhas.push(nome+' → '+e.message); console.warn('Falha em '+nome+':',e); }
  });
  abrirAba('relatorio');
  if(falhas.length){
    setTimeout(()=>{ alert('Algumas etapas falharam (o restante está pronto):\n\n• '+falhas.join('\n• ')); },250);
  }
}

/* ---------- PWA ---------- */
function gerarIconePNG(tamanho){
  const cv=document.createElement('canvas');
  cv.width=tamanho; cv.height=tamanho;
  const ctx=cv.getContext('2d');
  const grad=ctx.createLinearGradient(0,0,0,tamanho);
  grad.addColorStop(0,'#1e5a99'); grad.addColorStop(1,'#0b2545');
  const r=tamanho*0.22;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(0,0,tamanho,tamanho,r); else ctx.rect(0,0,tamanho,tamanho);
  ctx.fillStyle=grad; ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='800 '+Math.round(tamanho*0.42)+'px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillText('AP',tamanho/2,tamanho*0.40);
  const lw=tamanho*0.42,lh=Math.max(2,tamanho*0.022);
  ctx.fillStyle='#00b4d8';
  ctx.fillRect(tamanho/2-lw/2,tamanho*0.62,lw,lh);
  ctx.fillStyle='#ffffff';
  ctx.font='700 '+Math.round(tamanho*0.10)+'px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillText('PROTENSÃO',tamanho/2,tamanho*0.72);
  ctx.fillStyle='#8fd8ea';
  ctx.font='700 '+Math.round(tamanho*0.11)+'px -apple-system,Helvetica,Arial,sans-serif';
  ctx.fillText('VIGA',tamanho/2,tamanho*0.84);
  return cv.toDataURL('image/png');
}

  }catch(err){ console.warn('Manifest/ícone:',err); }
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){

      self.addEventListener('fetch',e=>{

const LS_KEY='apavan_vp_projetos';
function lerProjetos(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function gravarProjetos(o){ try{ localStorage.setItem(LS_KEY,JSON.stringify(o)); }catch(e){ alert('Não foi possível salvar.'); } }
function salvarProjeto(){
  const nome=S.projeto.nome||prompt('Nome do projeto:','Viga '+new Date().toLocaleDateString('pt-BR'));
  if(!nome) return;
  S.projeto.nome=nome; sincronizarInputs();
  const ps=lerProjetos();
  ps[nome]={dados:deepClone(S),data:new Date().toISOString()};
  gravarProjetos(ps);
  alert('Projeto "'+nome+'" salvo.');
}
function abrirProjeto(){
  const ps=lerProjetos();
  const nomes=Object.keys(ps);
  if(!nomes.length){ alert('Nenhum projeto salvo.'); return; }
  const lista=nomes.map((n,i)=>(i+1)+') '+n+' ('+new Date(ps[n].data).toLocaleDateString('pt-BR')+')').join('\n');
  const esc=prompt('Projetos salvos:\n\n'+lista+'\n\nNúmero (ou "x" para excluir):','1');
  if(!esc) return;
  if(esc.toLowerCase()==='x'){
    const num=prompt('Número a EXCLUIR:','1');
    const idx=parseInt(num,10)-1;
    if(idx>=0&&idx<nomes.length&&confirm('Excluir "'+nomes[idx]+'"?')){
      delete ps[nomes[idx]]; gravarProjetos(ps); alert('Excluído.');
    }
    return;
  }
  const idx=parseInt(esc,10)-1;
  if(idx<0||idx>=nomes.length){ alert('Opção inválida.'); return; }
  S=Object.assign(deepClone(ESTADO_PADRAO),ps[nomes[idx]].dados);
  sincronizarInputs();
  alert('Projeto "'+nomes[idx]+'" carregado. Clique em CALCULAR.');
}

  el('btExpMem').onclick=()=>{ if(!R) executarCalculo(); baixar('APavan_Memoria_'+(S.projeto.nome||'viga')+'.html',gerarHTMLRelatorio()); };
  el('btPDF').onclick=()=>{ if(!R) executarCalculo(); window.print(); };
  el('btPrint2').onclick=()=>window.print();
  el('btExpRel').onclick=()=>{ if(!R) executarCalculo(); baixar('APavan_Relatorio_'+(S.projeto.nome||'viga')+'.html',gerarHTMLRelatorio()); };
  let _rto=null;
  function redesenharAbaAtiva(){
    const ativa=qs('.panel.on'); if(!ativa) return;
    const id=ativa.id.replace('p-','');
    if(['geometria','cabos','elu','ancoragem','placa'].indexOf(id)>=0) desenharComRetry(id);
    if(id==='graficos') atualizarGraficos();
  }
  window.addEventListener('resize',()=>{ clearTimeout(_rto); _rto=setTimeout(redesenharAbaAtiva,180); });
  window.addEventListener('orientationchange',()=>{ setTimeout(redesenharAbaAtiva,400); });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) setTimeout(redesenharAbaAtiva,150); });
  iniciarPWA();
  setTimeout(()=>{ try{ executarCalculo(); abrirAba('projeto'); }catch(e){ console.warn(e); } },300);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();
</script>
